source /boot/grub/config.cfg

# Live boot — ISO única: o ambiente escolhido aqui é o que o instalador instala
menuentry "Doors OS — KDE Plasma (experimentar e instalar)" --hotkey=k {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ quiet splash doors.ambiente=kde
	initrd	@INITRD_LIVE@
}
menuentry "Doors OS — Cinnamon (experimentar e instalar)" --hotkey=n {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ quiet splash doors.ambiente=cinnamon
	initrd	@INITRD_LIVE@
}
menuentry "Doors OS — XFCE (experimentar e instalar)" --hotkey=x {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ quiet splash doors.ambiente=xfce
	initrd	@INITRD_LIVE@
}
menuentry "Doors OS — GNOME (experimentar e instalar)" --hotkey=g {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ quiet splash doors.ambiente=gnome
	initrd	@INITRD_LIVE@
}

# You can add more entries like this
# menuentry "Alternate live boot" {
# linux @KERNEL_LIVE@ @APPEND_LIVE@ custom options here
# initrd @INITRD_LIVE@
# }
# menuentry "Alternate graphical installer" {
# linux @KERNEL_GI@ @APPEND_GI@ custom options here
# initrd @INITRD_GI@
# }
# menuentry "Alternate textual installer" {
# linux @KERNEL_DI@ @APPEND_DI@ custom options here
# initrd @INITRD_DI@
# }

# Installer (if any)
if @ENABLE_INSTALL_MENU@; then

source	/boot/grub/install_start.cfg

submenu 'Advanced install options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Live padrão do live-build (inclui o modo de segurança / fail-safe)
	@LINUX_LIVE@

	# Memtest (if any)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
