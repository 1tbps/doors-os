---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false

# Doors OS: o usuário escolhe a senha (pode ser curta); só não pode ser vazia
passwordRequirements:
    nonempty: true
allowWeakPasswords: true
allowWeakPasswordsDefault: true

