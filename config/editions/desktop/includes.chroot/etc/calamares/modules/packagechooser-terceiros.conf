# Doors OS: opção de instalar software de terceiros (o valor vai para packagechooser_terceiros)
mode: optional
method: legacy
labels:
    step: "Software de terceiros"
items:
    - id: terceiros
      name: "Codecs e drivers"
      description: "Codecs para mais formatos de áudio e vídeo e, se houver placa NVIDIA, o driver da NVIDIA. Vêm das seções contrib e non-free do Debian. Precisa de internet durante a instalação; sem internet, nada é instalado e dá para fazer depois com: sudo /usr/lib/doors/instalar-terceiros. Com Secure Boot ligado, o driver da NVIDIA pede um cadastro de chave no próximo boot."
      screenshot: "/usr/share/doors/ambientes/terceiros.png"
