# Doors OS: escolha do ambiente gráfico (o valor vai para packagechooser_ambiente)
mode: required
method: legacy
packageChoice: kde
labels:
    step: "Ambiente gráfico"
items:
    - id: kde
      name: "KDE Plasma"
      selected: true
      description: "Moderno e muito personalizável. Painel embaixo no estilo Mint e janela ativa com barra de título e bordas azuis. Tem \"imagem do dia\" entre os papéis de parede."
      screenshot: "/usr/share/doors/ambientes/kde.png"
    - id: cinnamon
      name: "Cinnamon"
      description: "O ambiente do Linux Mint: menu e barra clássicos. Janelas no estilo Xubuntu/MX com contorno azul na janela ativa."
      screenshot: "/usr/share/doors/ambientes/cinnamon.png"
    - id: xfce
      name: "XFCE"
      description: "Leve e rápido, ideal para computadores mais antigos. Painel no estilo Mint e visual do Xubuntu, com contorno azul na janela ativa."
      screenshot: "/usr/share/doors/ambientes/xfce.png"
