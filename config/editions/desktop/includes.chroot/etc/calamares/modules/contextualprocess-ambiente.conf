# Doors OS: remove do sistema instalado os ambientes que não foram escolhidos
dontChroot: false
timeout: 1800
packagechooser_ambiente:
    kde:      [ "/usr/lib/doors/escolher-ambiente kde" ]
    cinnamon: [ "/usr/lib/doors/escolher-ambiente cinnamon" ]
    xfce:     [ "/usr/lib/doors/escolher-ambiente xfce" ]
    gnome:    [ "/usr/lib/doors/escolher-ambiente gnome" ]
