[package]
name = "doors-aparencia"
version = "0.3.4"
edition = "2021"
description = "Doors Aparência: tema, cor de destaque, fundo, layout e fontes do Doors OS em um clique"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# só dependências empacotadas no Debian trixie (librust-gtk4-dev): o build é offline
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }

[profile.release]
lto = true
codegen-units = 1
