-- Doors OS: nome do computador, IP e domínio no canto da área de trabalho
-- (Cinnamon e XFCE). O texto vem de /usr/bin/doors-info-maquina.
-- Para desligar: Aplicativos de sessão / Iniciar automaticamente >
-- "Nome e IP na área de trabalho".
conky.config = {
    alignment = 'top_right',
    gap_x = 24,
    gap_y = 24,
    xinerama_head = 0,

    background = false,
    double_buffer = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_class = 'Conky',
    own_window_title = 'doors-info-maquina',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    use_xft = true,
    font = 'Noto Sans:bold:size=11',
    default_color = 'white',
    draw_shadows = true,
    default_shade_color = '000000',
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    update_interval = 10,
    total_run_times = 0,
    cpu_avg_samples = 1,
    net_avg_samples = 1,
    no_buffers = true,
    minimum_width = 220,
    uppercase = false,
}

conky.text = [[
${execpi 10 /usr/bin/doors-info-maquina --conky}
]]
