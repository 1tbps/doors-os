# Doors OS — ajustes do serviço SSH (pacote doors-ssh)
[Unit]
# na sessão live (pendrive) o SSH fica desligado: a senha do usuário live é conhecida
ConditionKernelCommandLine=!boot=live

[Service]
# As chaves do servidor (/etc/ssh/ssh_host_*) não vêm na ISO: cada computador gera as
# suas na primeira vez que o SSH sobe (ssh-keygen -A só cria as que faltam).
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
