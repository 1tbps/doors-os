# Doors OS — acesso remoto por SSH (manutenção pela rede)
# Os arquivos de sshd_config.d são lidos antes do /etc/ssh/sshd_config, e no sshd vale o
# primeiro valor encontrado: o que está aqui ganha do padrão do Debian.
# Para mudar, edite este arquivo e rode: sudo sshd -t && sudo systemctl restart ssh
PermitRootLogin no
PasswordAuthentication yes
MaxAuthTries 4
LoginGraceTime 30
